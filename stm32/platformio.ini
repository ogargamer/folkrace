[platformio]
default_envs = stm32_dual_foc, stm32_bldc_main, stm32_bldc_usb_test, stm32_i2c_test, STM32_Motor_24_08, stm32_kv_finder, stm32_pwm_test, stm32_lut_test, esp32_motor_test
src_dir = .
boards_dir = boards

; ---------------------------------------------------------------------------
; Base: STM32G474 BLDC Controller (SimpleFOC, 921600 Baud Console)
; ---------------------------------------------------------------------------
[env:generic_stm32]
platform = ststm32
board = genericSTM32G474CB
framework = arduino
lib_archive = false
lib_deps =
    askuric/Simple FOC @ ^2.3.2
monitor_speed = 921600
monitor_eol = LF
build_flags =
    -DHAL_OPAMP_MODULE_ENABLED
    -DHAL_CORDIC_MODULE_ENABLED
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard

; ---------------------------------------------------------------------------
; STM32G474 — 20 kHz Dual-Motor FOC & MT6816 Shared SPI Suite
; ---------------------------------------------------------------------------
[env:stm32_dual_foc]
extends = env:generic_stm32
build_src_filter = -<*> +<src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -DSERIAL_RX_BUFFER_SIZE=512
    -DSERIAL_TX_BUFFER_SIZE=512
    -Os
    -I src
    -Wl,--defsym=_Min_Stack_Size=0x2000
    -Wl,--wrap=_micros
    -Wl,--wrap=sinf
    -Wl,--wrap=cosf
    -Wl,--wrap=sincosf
upload_protocol = dfu


; ---------------------------------------------------------------------------
; STM32 — Production Firmware (Quad-BLDC + Encoder + ESP32 UART Link)
; ---------------------------------------------------------------------------
[env:stm32_bldc_main]
extends = env:generic_stm32
build_src_filter = -<*> +<STM32_Main/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -I STM32_Main/include

; ---------------------------------------------------------------------------
; STM32 — General USB-CDC Test Bench (DFU upload, SoftWire I2C)
; ---------------------------------------------------------------------------
[env:stm32_bldc_usb_test]
extends = env:generic_stm32
build_src_filter = -<*> +<STM32_Test/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

; ---------------------------------------------------------------------------
; STM32 — Motor Test Bench (Magnetic Encoder Calibration & SPI Readout)
; ---------------------------------------------------------------------------
[env:STM32_Motor_24_08]
extends = env:generic_stm32
build_src_filter = -<*> +<encoder_test/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

[env:stm32_encoder_test]
extends = env:STM32_Motor_24_08

; ---------------------------------------------------------------------------
; STM32 — KV (RPM/Voltage) Constant Finder for BLDC Tuning
; ---------------------------------------------------------------------------
[env:stm32_kv_finder]
extends = env:generic_stm32
build_src_filter = -<*> +<kv_finder/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

; ---------------------------------------------------------------------------
; STM32 — PWM Phase Output Verification Test
; ---------------------------------------------------------------------------
[env:stm32_pwm_test]
extends = env:generic_stm32
build_src_filter = -<*> +<pwm_test/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
upload_protocol = dfu

; ---------------------------------------------------------------------------
; STM32 — I2C Bus Scan & Peripheral Detection Test
; ---------------------------------------------------------------------------
[env:stm32_i2c_test]
extends = env:generic_stm32
build_src_filter = -<*> +<test_i2c/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I test_i2c/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

; ---------------------------------------------------------------------------
; STM32 — Phase Current Look-Up Table (LUT) Validation
; ---------------------------------------------------------------------------
[env:stm32_lut_test]
extends = env:generic_stm32
build_src_filter = -<*> +<test_lut/src/> +<STM32_Test/src/> -<STM32_Test/src/main.cpp>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

; ---------------------------------------------------------------------------
; STM32 — Encoder Flash / OTP Burn Utility
; ---------------------------------------------------------------------------
[env:stm32_encoder_flash]
extends = env:generic_stm32
build_src_filter = -<*> +<encoder_flash/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

; ===========================================================================
; ESP32-S3 DevKitC-1 (SimpleFOC Motor Controller & Sensor Hub)
; ===========================================================================

; ---------------------------------------------------------------------------
; ESP32-S3 — Motor 1 Test Bench & SimpleFOC Suite (GM3506 + MT6816 SPI)
; ---------------------------------------------------------------------------
[env:esp32_motor_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_src_filter = -<*> +<../esp32/motor_test/>
build_flags =
    -I ../esp32/include
    -I ../esp32/motor_test
lib_deps =
    askuric/Simple FOC @ 2.3.2
    SPI

; ---------------------------------------------------------------------------
; ESP32 — Production Firmware (IMU + STM32 Link + Pi5 Telemetry)
; ---------------------------------------------------------------------------
[env:esp32_sensor_hub]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 921600
build_src_filter = -<*> +<../esp32/src/>
build_flags =
    -I ../esp32/include
lib_deps =
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.12
    adafruit/Adafruit BNO08x @ ^1.0.5
    adafruit/Adafruit BusIO @ ^1.16.1
    madhephaestus/ESP32Servo @ ^3.0.5

; ---------------------------------------------------------------------------
; ESP32 — BNO08x IMU Backup / Known-Good Snapshot
; ---------------------------------------------------------------------------
[env:esp32_imu_backup]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 921600
build_src_filter = -<*> +<../esp32/backup_bno08x_working/main.cpp> +<../esp32/backup_bno08x_working/imu_bno08x.cpp> +<../esp32/src/stm32_link.cpp>
build_flags =
    -I ../esp32/include
    -I ../esp32/backup_bno08x_working
lib_deps =
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.12

; ---------------------------------------------------------------------------
; ESP32 — Steering Servo PWM Tuning & Calibration
; ---------------------------------------------------------------------------
[env:esp32_servo_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 921600
build_src_filter = -<*> +<../esp32/servo_test/> +<../esp32/src/servo_driver.cpp>
build_flags =
    -I ../esp32/include
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

; ---------------------------------------------------------------------------
; ESP32 — Native Unit Test Runner (x86, no hardware)
; ---------------------------------------------------------------------------
[env:esp32_native_unit_test]
platform = native
build_src_filter = -<*> +<../esp32/src/> +<../webots/validation/test/>
build_flags =
    -std=c++17
    -I ../esp32/include

; ---------------------------------------------------------------------------
; ESP32 — VL53L8CX ToF Sensor Integration Test (SPI, 4x4 @ 60Hz)
; ---------------------------------------------------------------------------
[env:esp32_tof_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 921600
build_src_filter = -<*> +<../esp32/tof_test/> +<../esp32/VL53L8CX/src/> -<../esp32/VL53L8CX/src/vl53l8cx_platform.c> -<../esp32/VL53L8CX/src/vl53l8cx.cpp>
build_flags =
    -I ../esp32/include
    -I ../esp32/VL53L8CX/src
    -D VL53L8CX_NB_TARGET_PER_ZONE=4U
lib_deps =
    Wire
    SPI

; ---------------------------------------------------------------------------
; ESP32 — ToF Backup / Known-Good Snapshot
; ---------------------------------------------------------------------------
[env:esp32_tof_backup]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 921600
build_src_filter = -<*> +<../esp32/backup_tof_working/> +<../esp32/VL53L8CX/src/> -<../esp32/VL53L8CX/src/vl53l8cx_platform.c> -<../esp32/VL53L8CX/src/vl53l8cx.cpp>
build_flags =
    -I ../esp32/include
    -I ../esp32/VL53L8CX/src
    -D VL53L8CX_NB_TARGET_PER_ZONE=4U
lib_deps =
    Wire
    SPI
