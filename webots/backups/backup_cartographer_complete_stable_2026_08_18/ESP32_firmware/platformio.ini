[platformio]
default_envs = main, test, test_i2c, encoder_test, kv_finder, pwm_test, test_lut
src_dir = STM32
boards_dir = STM32/STM32_Main/boards

[env:generic_stm32]
platform = ststm32
board = genericSTM32G474CB
framework = arduino
lib_archive = false
lib_deps =
    askuric/Simple FOC @ ^2.3.2
monitor_speed = 921600
monitor_eol = LF
build_flags =
    -DHAL_OPAMP_MODULE_ENABLED
    -DHAL_CORDIC_MODULE_ENABLED

[env:main]
extends = env:generic_stm32
build_src_filter = -<*> +<STM32_Main/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -I STM32/STM32_Main/include

[env:test]
extends = env:generic_stm32
build_src_filter = -<*> +<STM32_Test/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32/STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

[env:encoder_test]
extends = env:generic_stm32
build_src_filter = -<*> +<encoder_test/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32/STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

[env:kv_finder]
extends = env:generic_stm32
build_src_filter = -<*> +<kv_finder/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32/STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

[env:pwm_test]
extends = env:generic_stm32
build_src_filter = -<*> +<pwm_test/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32/STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
upload_protocol = dfu

[env:test_i2c]
extends = env:generic_stm32
build_src_filter = -<*> +<test_i2c/src/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32/test_i2c/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

[env:test_lut]
extends = env:generic_stm32
build_src_filter = -<*> +<test_lut/src/> +<STM32_Test/src/> -<STM32_Test/src/main.cpp>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -I STM32/STM32_Test/include
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

[env:encoder_flash]
extends = env:generic_stm32
build_src_filter = -<*> +<encoder_flash/>
build_flags =
    ${env:generic_stm32.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
lib_deps =
    ${env:generic_stm32.lib_deps}
    stevemarple/SoftWire
upload_protocol = dfu

[env:esp32s3_master]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 921600
build_src_filter = -<*> +<../ESP32/src/>
build_flags =
    -I ESP32/include
lib_deps =
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.12
    adafruit/Adafruit BNO08x @ ^1.0.5
    adafruit/Adafruit BusIO @ ^1.16.1
    madhephaestus/ESP32Servo @ ^3.0.5

[env:bno_backup_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 921600
build_src_filter = -<*> +<../ESP32/backup_bno08x_working/main.cpp> +<../ESP32/backup_bno08x_working/imu_bno08x.cpp> +<../ESP32/src/stm32_link.cpp>
build_flags =
    -I ESP32/include
    -I ESP32/backup_bno08x_working
lib_deps =
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.12


[env:servo_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 921600
build_src_filter = -<*> +<../ESP32/servo_test/> +<../ESP32/src/servo_driver.cpp>
build_flags =
    -I ESP32/include
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

[env:native]
platform = native
build_src_filter = -<*> +<../ESP32/src/> +<../test/>
build_flags =
    -std=c++17
    -I ESP32/include

[env:tof_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 921600
build_src_filter = -<*> +<../ESP32/tof_test/> +<../ESP32/VL53L8CX/src/> -<../ESP32/VL53L8CX/src/vl53l8cx_platform.c> -<../ESP32/VL53L8CX/src/vl53l8cx.cpp>
build_flags =
    -I ESP32/include
    -I ESP32/VL53L8CX/src
lib_deps =
    Wire
    SPI

