[platformio]
default_envs = stm32_dual_foc, esp32_main, esp32_tof
src_dir = ESP32/simplefoc_mt6816_suite/src
boards_dir = STM32/boards

; ==============================================================================
; ESP32 MAIN: Real-Time Motion, IMU (BNO08x), Servos & STM32 FOC Master Link
; ==============================================================================
[env:esp32_main]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
upload_speed = 921600
monitor_port = COM8
monitor_speed = 921600
build_src_filter =
    -<*>
    +<../../ESP32_Main/src/*.cpp>
build_flags =
    -I ESP32/ESP32_Main/include
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    Wire
    SPI
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.12

; ==============================================================================
; ESP32 TOF: Dedicated Dual-SPI Perception Hub (4x VL53L8CX Multizone ToFs)
; ==============================================================================
[env:esp32_tof]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 921600
build_src_filter =
    -<*>
    +<../../ESP32_ToF/src/*.cpp>
build_flags =
    -I ESP32/ESP32_ToF/include
    -I ESP32/ESP32_ToF/VL53L8CX/src
    -I ESP32/ESP32_ToF/src
    -D VL53L8CX_NB_TARGET_PER_ZONE=2U
    -D VL53L8CX_DISABLE_SIGNAL_PER_SPAD
    -D VL53L8CX_DISABLE_RANGE_SIGMA_MM
    -D VL53L8CX_DISABLE_AMBIENT_PER_SPAD
    -D VL53L8CX_DISABLE_NB_TARGET_DETECTED
    -D VL53L8CX_DISABLE_REFLECTANCE_PERCENT
    -D VL53L8CX_DISABLE_MOTION_INDICATOR
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    Wire
    SPI
    ESP32/ESP32_ToF/VL53L8CX

; Legacy Alias for backwards compatibility
[env:esp32_tof_diag]
extends = env:esp32_tof

[env:esp32s3_suite]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    askuric/Simple FOC @ 2.3.3
    Wire
    SPI

[env:esp32s3_servo_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
upload_speed = 921600
monitor_port = COM8
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../../servo_test/*.cpp>
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; ==============================================================================
; STM32G474: Dual-Motor FOC Controller & MT6816 Shared SPI Suite
; ==============================================================================
[stm32_base]
platform = ststm32
board = genericSTM32G474CB
framework = arduino
lib_archive = false
lib_deps =
    askuric/Simple FOC @ ^2.3.2
monitor_speed = 921600
monitor_eol = LF
build_flags =
    -DHAL_OPAMP_MODULE_ENABLED
    -DHAL_CORDIC_MODULE_ENABLED
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard

[env:stm32_dual_foc]
extends = stm32_base
build_src_filter =
    -<*>
    +<../../../STM32/src/*.cpp>
    +<../../../STM32/src/*.c>
build_flags =
    ${stm32_base.build_flags}
    -DUSBCON
    -DUSBD_USE_CDC
    -DSERIAL_RX_BUFFER_SIZE=512
    -DSERIAL_TX_BUFFER_SIZE=512
    -O2
    -I STM32/src
upload_protocol = dfu

