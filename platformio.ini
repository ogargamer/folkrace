[platformio]
default_envs = esp32s3_suite
src_dir = ESP32/simplefoc_mt6816_suite/src

[env:esp32s3_suite]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    askuric/Simple FOC @ 2.3.3
    Wire
    SPI

[env:esp32_tof_diag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 921600
build_src_filter =
    -<*>
    +<../../tof_test/*.cpp>
build_flags =
    -I ESP32/include
    -I ESP32/VL53L8CX/src
    -I ESP32/tof_test
    -D VL53L8CX_NB_TARGET_PER_ZONE=4U
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    Wire
    SPI
    ESP32/VL53L8CX


