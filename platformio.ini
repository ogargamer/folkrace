[platformio]
default_envs = esp32s3_suite
src_dir = ESP32/simplefoc_mt6816_suite/src

[env:esp32s3_suite]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    askuric/Simple FOC @ 2.3.3
    Wire
    SPI
