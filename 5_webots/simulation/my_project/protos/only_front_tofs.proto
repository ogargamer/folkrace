        noise 0.001
      }
      Accelerometer {
        translation 0 -0.01 0.015
      }
      Gyro {
        translation 0 -0.01 0.015
      }
    ]
    contactMaterial "chassis"
    boundingObject Group {
      children [
        # Solid lower chassis core enclosing frame and wheel clearances (prevents wall/pillar tunneling & trapping)
        Pose {
          translation 0 0.0015 0.02
          children [
            Box {
              size 0.15 0.203 0.04
            }
          ]
        }
        # Solid upper body shell matching visual housing (prevents opponent/wall clipping above top plate)
        Pose {
          translation 0 -0.0075 0.067
          children [
            Box {
              size 0.136 0.165 0.056
            }
          ]
        }
      ]
    }
    physics Physics {
      density -1
      mass IS bodyMass
      centerOfMass [
        0 0 -0.005
      ]
      inertiaMatrix [
        %<= (0.002861 * fields.bodyMass.value / 0.6).toFixed(6) >% %<= (0.002133 * fields.bodyMass.value / 0.6).toFixed(6) >% %<= (0.003769 * fields.bodyMass.value / 0.6).toFixed(6) >%
        0 0 0
      ]
      damping Damping {
        linear 0.05
        angular 0.35
      }
    }
  }
}
