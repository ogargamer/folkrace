        ]
      }
      Pose {
        translation -0.0565 -0.07 0
        children [
          CadShape {
            url [
              "meshes/Wheel joint.obj"
            ]
          }
        ]
      }
      Pose {
        children [
          CadShape {
            url [
              "meshes/Frame.obj"
            ]
          }
        ]
        rotationStep 0
      }
      # Upper body shell (strictly behind y=+0.075 to avoid self-occlusion of front Lidars at y=+0.090,
