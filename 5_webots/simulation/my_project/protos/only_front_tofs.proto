PROTO only_front_tofs [
  field SFVec3f    translation     0 0 0.0275
  field SFRotation rotation        0 0 1 -1.5707953071795862
  field SFString   name            "only front tofs"
  field SFString   controller      "tof_path_planner"
  field MFString   controllerArgs  []
  field SFString   customData      ""
  field SFBool     supervisor      TRUE
  field SFBool     synchronization TRUE
  field SFFloat    bodyMass        0.6
  field SFFloat    wheelMass       0.1
  field SFFloat    motorMaxTorque  0.3
  field SFFloat    motorMaxVel     139.64
  field SFColor    badgeColor      0.0 0.9 1.0
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    children [
      HingeJoint {
        jointParameters HingeJointParameters {
          anchor -0.0565 -0.07 0
        }
        device [
          RotationalMotor {
            name "motor RL"
            maxVelocity IS motorMaxVel
            maxTorque IS motorMaxTorque
          }
          PositionSensor {
            name "encoder RL"
          }
        ]
        endPoint Solid {
          translation -0.0565 -0.07 0
          rotation -2.0221621509013514e-12 -1 2.0220883794014218e-12 1.5707963000003338
          children [
            Pose {
              translation 0 0 -0.0125
              rotation 0 1 0 -1.5707963
              children [
                CadShape {
                  url [
                    "meshes/Wheel.obj"
                  ]
                }
              ]
            }
          ]
          name "RL"
          contactMaterial "tire"
          boundingObject Cylinder {
            height 0.025
            radius 0.0275
            subdivision 32
          }
          physics Physics {
            density -1
            mass IS wheelMass
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          anchor 0.0565 -0.07 0
        }
        device [
          RotationalMotor {
            name "motor RR"
            maxVelocity IS motorMaxVel
            maxTorque IS motorMaxTorque
          }
          PositionSensor {
            name "encoder RR"
          }
        ]
        endPoint Solid {
          translation 0.0565 -0.07 0
          rotation 0 1 0 1.5708
          children [
            Pose {
              translation 0 0 -0.0125
              rotation 0 1 0 -1.5707963
              children [
                CadShape {
                  url [
                    "meshes/Wheel.obj"
                  ]
                }
              ]
            }
          ]
          name "RR"
          contactMaterial "tire"
          boundingObject Cylinder {
            height 0.025
            radius 0.0275
            subdivision 32
          }
          physics Physics {
            density -1
            mass IS wheelMass
          }
        }
      }
      Hinge2Joint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0.031 0.0625 0
          minStop -0.610865
          maxStop 0.610865
          dampingConstant 0.05
        }
        jointParameters2 JointParameters {
          axis 1 0 0
          dampingConstant 0.001
        }
        device [
          RotationalMotor {
            name "servo right"
            controlPID 80 0 0
            maxVelocity 35
            minPosition -0.610865
            maxPosition 0.610865
            maxTorque 5
          }
          PositionSensor {
            name "servo right sensor"
          }
        ]
        device2 [
          RotationalMotor {
            name "motor FR"
            maxVelocity IS motorMaxVel
            maxTorque IS motorMaxTorque
          }
          PositionSensor {
            name "encoder FR"
          }
        ]
        endPoint Solid {
          translation 0.049 0.0625 0
          rotation 0 -1 0 1.5707963000000003
          children [
            Pose {
              translation 0 0 0.0125
              rotation 0 1 0 1.5707963
              children [
                CadShape {
                  url [
                    "meshes/Wheel.obj"
                  ]
                }
              ]
            }
          ]
          name "FR"
          contactMaterial "tire"
          boundingObject Cylinder {
            height 0.025
            radius 0.0275
            subdivision 32
          }
          physics Physics {
            density -1
