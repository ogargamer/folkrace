      Pose {
        translation 0 -0.0075 0.0525
        children [
          Shape {
            appearance PBRAppearance {
              baseColor IS badgeColor
              roughness 0.4
              metalness 0.1
            }
            geometry Box {
              size 0.136 0.165 0.085
            }
          }
        ]
      }
      # Front Left ToF Inner Bank (4x 11.25deg zones: 4.1deg, 15.4deg, 26.6deg, 37.9deg)
